[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-sentry"
version = "0.4.0"
description = "Canonical snapshots, SHA-256 contract hashes, breaking-change diffs, a local review policy, and SARIF output plus a GitHub Action for OpenAI, Anthropic, and MCP tool schemas."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Justin Wilson" }]
keywords = ["tools", "json-schema", "openai", "anthropic", "mcp", "snapshot", "sarif"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
tool-sentry = "tool_sentry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      # tool-sentry against its own committed sample contract: snapshot it,
      # then diff the lock back against the document it came from. Any drift
      # in canonicalization or classification fails here, not in a consumer.
      - name: Snapshot the sample contract
        run: tool-sentry snapshot tests/fixtures/openai_tools.json --out /tmp/self.lock.json
      - name: Diff the sample contract against its own lock
        run: tool-sentry diff /tmp/self.lock.json tests/fixtures/openai_tools.json --fail-on informational

  action:
    # Runs the bundled composite action on the committed example pair. No
    # secrets, no token, no network. --fail-on never keeps the job green
    # while still printing the ::error annotations the example produces.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          baseline: examples/sarif/baseline.json
          candidate: examples/sarif/candidate.json
          fail-on: never
          output: tool-sentry.sarif
      - name: Show the SARIF log
        run: python -c "import json,sys; log=json.load(open('tool-sentry.sarif')); print(log['version'], len(log['runs'][0]['results']), 'results')"
